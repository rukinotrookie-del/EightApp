name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile unsigned app
        run: |
          xcodebuild -project EightApp.xcodeproj \
            -scheme EightApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Pack into IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/EightApp.app Payload/
          zip -r EightApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EightApp-IPA
          path: EightApp.ipa
